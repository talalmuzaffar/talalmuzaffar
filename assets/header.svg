    <rect class="ln" x="784" y="208" width="92" height="4" rx="2"/>
    <rect class="ln" x="784" y="230" width="30" height="5" rx="2.5"/>
    <rect class="lnb" x="836" y="228" width="40" height="8" rx="3"/>
    <g clip-path="url(#docclip)">
      <rect class="beam" x="768" y="82" width="124" height="46" fill="url(#beam)"/>
    </g>
