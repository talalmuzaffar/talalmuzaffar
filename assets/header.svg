  <g class="card">
    <rect x="904" y="200" width="252" height="102" rx="12" fill="#22304f" stroke="#3b4a6b" stroke-width="1.2"/>
    <g clip-path="url(#cardclip)">
      <text class="q" x="922" y="228">› what's overdue?</text>
      <rect class="cover cq" x="922" y="212" width="240" height="22"/>
