<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="title desc">
  <title id="title">Talal Muzaffar</title>
  <desc id="desc">ML Lead at DOST AI. An invoice is scanned, its fields extracted and indexed, and an agent answers a question about it, waiting for approval before acting.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" opacity=".06"/>
    </pattern>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset=".85" stop-color="#5eead4" stop-opacity=".28"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity=".95"/>
    </linearGradient>
    <radialGradient id="glow" cx=".82" cy=".5" r=".55">
      <stop offset="0" stop-color="#5eead4" stop-opacity=".09"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="docclip"><rect x="768" y="82" width="124" height="168" rx="8"/></clipPath>
    <clipPath id="cardclip"><rect x="904" y="200" width="252" height="102" rx="12"/></clipPath>
  </defs>
  <style>
    .name { font: 700 54px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f8fafc; letter-spacing: -1px; }
    .tag { font: 500 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #cbd5e1; }
    .role { font: 400 18px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #94a3b8; }
    .chip { fill: #22304f; stroke: #3b4a6b; stroke-width: 1.2; }
    .chipt { font: 500 16px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #e2e8f0; }
    .teal { fill: #5eead4; }
    .doc { fill: #22304f; stroke: #3b4a6b; stroke-width: 1.2; }
    .ln { fill: #3b4a6b; }
    .lnb { fill: #64748b; }
    .box { fill: #5eead4; fill-opacity: .1; stroke: #5eead4; stroke-width: 1.5; }
    .edge { stroke: #3b4a6b; stroke-width: 1.2; }
    .nedge { stroke: #5eead4; stroke-width: 1.4; stroke-dasharray: 50; }
    .node { fill: #5eead4; opacity: .5; }
    .q { font: 400 14px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #94a3b8; }
    .a { font: 600 16px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #e2e8f0; }
    .btn { fill: #5eead4; fill-opacity: .12; stroke: #5eead4; stroke-width: 1.2; }
    .btnt { font: 500 12px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #5eead4; }
    .cover { fill: #22304f; }

    /* one 10s loop; every element keys off the same clock so they never drift */
    .front { animation: front 10s infinite; }
    .beam { animation: beam 10s linear infinite; transform: translateY(170px); }
    .bA { animation: bA 10s infinite; }
    .bB { animation: bB 10s infinite; }
    .bC { animation: bC 10s infinite; }
    .dA { animation: dA 10s ease-in-out infinite; opacity: 0; }
    .dB { animation: dB 10s ease-in-out infinite; opacity: 0; }
    .dC { animation: dC 10s ease-in-out infinite; opacity: 0; }
    .newnode { animation: newnode 10s infinite; transform-box: fill-box; transform-origin: center; }
    .ne { animation: ne 10s infinite; }
    .link { animation: link 10s infinite; stroke-dasharray: 30; }
    .hub { animation: hub 10s infinite; }
    .card { animation: card 10s infinite; }
    .cq { animation: cq 10s infinite; transform: translateX(144px); }
    .ca { animation: ca 10s infinite; transform: translateX(193px); }
    .bt { animation: bt 10s infinite; }
    .press { animation: press 10s infinite; }

    @keyframes front { 0% { opacity: 0; transform: translateX(-18px); } 5%, 92% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateX(18px); } }
    @keyframes beam { 0%, 6% { transform: translateY(-46px); } 40%, 100% { transform: translateY(170px); } }
    @keyframes bA { 0%, 12.6% { opacity: 0; } 14.6%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes bB { 0%, 21.1% { opacity: 0; } 23.1%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes bC { 0%, 29.1% { opacity: 0; } 31.1%, 92% { opacity: 1; } 97%, 100% { opacity: 0; } }
    @keyframes dA { 0%, 34% { opacity: 0; transform: none; } 36% { opacity: 1; } 48% { opacity: 1; transform: translate(220px, 43px); } 50%, 100% { opacity: 0; transform: translate(220px, 43px); } }
    @keyframes dB { 0%, 37% { opacity: 0; transform: none; } 39% { opacity: 1; } 50% { opacity: 1; transform: translate(177px, -11px); } 52%, 100% { opacity: 0; transform: translate(177px, -11px); } }
    @keyframes dC { 0%, 40% { opacity: 0; transform: none; } 42% { opacity: 1; } 52% { opacity: 1; transform: translate(180px, -62px); } 54%, 100% { opacity: 0; transform: translate(180px, -62px); } }
    @keyframes newnode { 0%, 49% { opacity: 0; transform: scale(0); } 53% { opacity: 1; transform: scale(1.35); } 56%, 92% { opacity: 1; transform: scale(1); } 98%, 100% { opacity: 0; transform: scale(1); } }
    @keyframes ne { 0%, 52% { stroke-dashoffset: 50; opacity: 1; } 58%, 92% { stroke-dashoffset: 0; opacity: 1; } 98%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes hub { 0%, 54% { opacity: .5; } 58% { opacity: 1; } 66%, 100% { opacity: .5; } }
    @keyframes link { 0%, 58% { stroke-dashoffset: 30; opacity: 1; } 62%, 92% { stroke-dashoffset: 0; opacity: 1; } 98%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes card { 0%, 61% { opacity: 0; transform: translateY(8px); } 65%, 92% { opacity: 1; transform: none; } 98%, 100% { opacity: 0; transform: none; } }
    @keyframes cq { 0%, 66% { transform: translateX(0); animation-timing-function: steps(17, end); } 72%, 100% { transform: translateX(144px); } }
    @keyframes ca { 0%, 74% { transform: translateX(0); animation-timing-function: steps(20, end); } 79%, 100% { transform: translateX(193px); } }
    @keyframes bt { 0%, 81% { opacity: 0; } 84%, 92% { opacity: 1; } 98%, 100% { opacity: 0; } }
    @keyframes press { 0%, 87% { fill-opacity: .12; } 88.5%, 92% { fill-opacity: .45; } 98%, 100% { fill-opacity: .12; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .dA, .dB, .dC { opacity: 0; }
    }
  </style>

  <rect width="1200" height="340" rx="18" fill="#1a2238"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow)"/>

  <!-- left: who -->
  <text class="name" x="64" y="110">Talal Muzaffar</text>
  <text class="tag" x="65" y="152">I turn piles of financial documents into answers.</text>
  <text class="role" x="66" y="196">ML Lead at</text>
