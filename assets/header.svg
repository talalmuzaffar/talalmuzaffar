  <circle class="dB" cx="859" cy="181" r="3.5" fill="#5eead4"/>
  <circle class="dC" cx="856" cy="232" r="3.5" fill="#5eead4"/>

  <line class="edge" x1="960" y1="96" x2="1004" y2="134"/>
  <line class="edge" x1="1006" y1="70" x2="1004" y2="134"/>
