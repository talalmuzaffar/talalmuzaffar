  </g>
  <text class="role" x="260" y="196"><tspan class="teal">·</tspan> Paris</text>

  <rect class="chip" x="64" y="226" width="210" height="38" rx="19"/>
  <text class="chipt" x="84" y="250"><tspan class="teal">3.8M+</tspan> docs indexed</text>
  <rect class="chip" x="286" y="226" width="200" height="38" rx="19"/>
  <text class="chipt" x="306" y="250"><tspan class="teal">100K+</tspan> pages/month</text>
  <rect class="chip" x="498" y="226" width="152" height="38" rx="19"/>
  <text class="chipt" x="518" y="250"><tspan class="teal">10</tspan> countries</text>

  <!-- right: an invoice is read, indexed, and answered about -->
  <rect class="doc" x="744" y="62" width="124" height="168" rx="8" opacity=".45"/>
  <rect class="doc" x="756" y="72" width="124" height="168" rx="8" opacity=".75"/>

  <g class="front">
    <rect class="doc" x="768" y="82" width="124" height="168" rx="8"/>
    <rect class="lnb" x="784" y="98" width="30" height="8" rx="2"/>
    <rect class="ln" x="846" y="99" width="30" height="5" rx="2.5"/>
    <rect class="lnb" x="784" y="124" width="64" height="6" rx="3"/>
    <rect class="ln" x="784" y="144" width="92" height="5" rx="2.5"/>
