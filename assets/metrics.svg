<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 156" width="1200" height="156" role="img" aria-labelledby="title">
  <title id="title">Onboarding in 1 session instead of days. 10+ enterprise customers onboarded a month. Vendor mapping in 5 minutes per batch, twice as fast. 100+ vendors reconciled automatically per customer.</title>
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .card { fill: #1a2238; stroke: #2c3a5a; stroke-width: 1.2; }
    .num { font: 700 42px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #5eead4; letter-spacing: -.5px; }
    .unit { font: 600 22px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #5eead4; }
    .l1 { font: 500 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e2e8f0; }
    .l2 { font: 400 16px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #94a3b8; }
  </style>

  <g class="c">
    <rect class="card" x="1" y="1" width="286" height="154" rx="14"/>
    <rect x="104" y="1" width="80" height="2.5" fill="url(#bar)"/>
    <text text-anchor="middle" x="144" y="70"><tspan class="num">1</tspan><tspan class="unit" dx="6">session</tspan></text>
    <text class="l1" text-anchor="middle" x="144" y="106">customer onboarding</text>
    <text class="l2" text-anchor="middle" x="144" y="130">down from days</text>
  </g>
  <g class="c c2">
    <rect class="card" x="305" y="1" width="286" height="154" rx="14"/>
    <rect x="408" y="1" width="80" height="2.5" fill="url(#bar)"/>
    <text text-anchor="middle" x="448" y="70"><tspan class="num">10+</tspan><tspan class="unit" dx="6">/ month</tspan></text>
    <text class="l1" text-anchor="middle" x="448" y="106">enterprise customers onboarded</text>
    <text class="l2" text-anchor="middle" x="448" y="130">sustained, month after month</text>
  </g>
  <g class="c c3">
    <rect class="card" x="609" y="1" width="286" height="154" rx="14"/>
    <rect x="712" y="1" width="80" height="2.5" fill="url(#bar)"/>
    <text text-anchor="middle" x="752" y="70"><tspan class="num">5</tspan><tspan class="unit" dx="6">min</tspan></text>
    <text class="l1" text-anchor="middle" x="752" y="106">vendor mapping per batch</text>
    <text class="l2" text-anchor="middle" x="752" y="130">2× faster than before</text>
  </g>
  <g class="c c4">
    <rect class="card" x="913" y="1" width="286" height="154" rx="14"/>
    <rect x="1016" y="1" width="80" height="2.5" fill="url(#bar)"/>
    <text text-anchor="middle" x="1056" y="70"><tspan class="num">100+</tspan><tspan class="unit" dx="6">vendors</tspan></text>
    <text class="l1" text-anchor="middle" x="1056" y="106">reconciled per customer</text>
    <text class="l2" text-anchor="middle" x="1056" y="130">automatically</text>
  </g>
</svg>
